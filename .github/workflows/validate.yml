name: Validate Get Set Go

on:
  push:
    branches: [main, minimal-slice-v1]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Syntax-check proof scripts
        run: |
          node --check scripts/proof-meta-models.mjs
          node --check scripts/proof-browser-capture.mjs
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run
